<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Cookie Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter, Space Grotesk & Outfit for titles) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        title: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#050505',
                            card: '#121212',
                            accent: '#ffffff',
                            accentHover: '#e5e7eb',
                            glow: 'transparent',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for menu */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ffffff;
        }
        
        /* Ultra-transparent Glassmorphism */
        .glassmorphism {
            background: rgba(255, 255, 255, 0.005);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.025);
        }

        /* Clean White Neon Text Glow */
        .neon-white {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.95),
                         0 0 20px rgba(255, 255, 255, 0.45),
                         0 0 40px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-brand-bg text-white font-sans min-h-screen flex flex-col justify-between overflow-x-hidden relative selection:bg-white selection:text-black">

    <!-- Background Grid Overlay -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:32px_32px] pointer-events-none"></div>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12 z-10 relative">
        <div class="w-full max-w-xl text-center flex flex-col items-center">

            <!-- Title & Subtitle -->
            <h1 class="text-4xl md:text-6xl font-title font-extrabold tracking-tight mb-4 select-none neon-white leading-tight">
                Fake Cookie Generator
            </h1>
            <p class="text-neutral-400 text-sm md:text-base max-w-md mb-8 leading-relaxed">
                Generate custom cookies instantly with a single click. This can be helpful to troll scammers who are asking for your cookie.
            </p>

            <!-- Input Box for Output -->
            <div class="w-full max-w-md mb-6">
                <textarea id="outputBox" readonly placeholder="Your generated cookie data will appear here..." class="w-full h-48 p-4 bg-white/[0.02] backdrop-blur-md text-white placeholder-neutral-500 font-mono text-sm rounded-xl border border-white/[0.05] focus:outline-none focus:border-white/20 resize-none shadow-inner"></textarea>
            </div>

            <!-- Action Buttons Container -->
            <div class="w-full max-w-xs flex gap-4 mb-8">
                <!-- Generate Button -->
                <div class="w-full relative group">
                    <div class="absolute -inset-0.5 bg-white rounded-xl blur opacity-0 group-hover:opacity-10 transition duration-300 pointer-events-none"></div>
                    <button onclick="handleGenerate()" class="relative w-full py-4 px-6 bg-white/[0.02] hover:bg-white/[0.08] backdrop-blur-md text-white font-semibold rounded-xl transition duration-200 flex items-center justify-center space-x-2 border border-white/[0.05] group-active:scale-[0.98]">
                        <svg class="w-5 h-5 text-white group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                        </svg>
                        <span class="tracking-wide text-white">Generate</span>
                    </button>
                </div>

                <!-- Copy Button -->
                <div class="w-full relative group">
                    <div class="absolute -inset-0.5 bg-white rounded-xl blur opacity-0 group-hover:opacity-10 transition duration-300 pointer-events-none"></div>
                    <button onclick="handleCopy()" class="relative w-full py-4 px-6 bg-white/[0.02] hover:bg-white/[0.08] backdrop-blur-md text-white font-semibold rounded-xl transition duration-200 flex items-center justify-center space-x-2 border border-white/[0.05] group-active:scale-[0.98]">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        <span class="tracking-wide text-white">Copy</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Bottom Left Discord Button -->
    <div class="fixed bottom-6 left-6 z-40">
        <a href="https://discord.gg/U3haY8aNT" target="_blank" rel="noopener noreferrer" class="relative group flex items-center space-x-2 py-3 px-4 bg-white/[0.02] hover:bg-white/[0.08] backdrop-blur-md text-white font-semibold rounded-xl transition duration-200 border border-white/[0.05] shadow-lg group-active:scale-[0.98]">
            <div class="absolute -inset-0.5 bg-white rounded-xl blur opacity-0 group-hover:opacity-10 transition duration-300 pointer-events-none"></div>
            <svg class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            <span class="text-sm tracking-wide">Discord</span>
        </a>
    </div>

    <!-- Notification Toast system -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="glassmorphism p-4 rounded-xl shadow-2xl flex items-center space-x-3 border-neutral-700">
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <div>
                <p id="toastTitle" class="text-sm font-semibold">Cookie Generated</p>
                <p id="toastDesc" class="text-xs text-neutral-400">Successfully created a fresh cookie session.</p>
            </div>
        </div>
    </div>

    <script>
        function showToast(title, desc) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastDesc').innerText = desc;

            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 4000);
        }

        // Interactive Generate Functionality
        function handleGenerate() {
            const outputBox = document.getElementById('outputBox');
            
            // Generate exactly 584 random characters using only numbers and letters
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let randomPart = '';
            for (let i = 0; i < 584; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            const warningPrefix = '_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_ ';
            outputBox.value = warningPrefix + randomPart;

            showToast('Cookie Generated', 'Successfully created a fresh cookie session.');
        }

        // Copy Functionality
        function handleCopy() {
            const outputBox = document.getElementById('outputBox');
            if (!outputBox.value) {
                showToast('Nothing to Copy', 'Generate a cookie first.');
                return;
            }

            navigator.clipboard.writeText(outputBox.value).then(() => {
                showToast('Copied to Clipboard', 'Cookie data copied successfully.');
            }).catch(() => {
                showToast('Failed to Copy', 'Please try again.');
            });
        }
    </script>
</body>
</html>
